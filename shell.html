<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#101418">
<meta name="xc-build" content="xc-read-1008">
<title>星辰之海</title>
<style>
/*@@CSS@@*/
</style>
</head>
<body>
<div id="app">
 <section id="title" class="scr on">
  <h1>星辰之海</h1>
  <button class="tbtn" id="tNew" type="button">開始記錄</button>
  <button class="tbtn" id="tCont" type="button">繼續</button>
 </section>
 <section id="game" class="scr">
  <div id="bg" data-k=""></div>
  <header id="hud">
   <div class="topline">
    <div id="hCh">第一章 · 刀刃與界限</div>
    <button id="hMenu" type="button">選單</button>
   </div>
   <div class="placeline">
    <b id="hPlace">諮商室</b>
    <span id="hFloor">聖瑞醫院 · 心理科</span>
    <span id="hTime">第1日 15:00</span>
   </div>
   <div id="meters"></div>
  </header>
  <div id="box">
   <div id="txt"></div>
   <div id="choices"></div>
   <p id="sum" class="sumline"></p>
   <p id="presence" class="presence"></p>
   <p id="count" hidden></p>
  </div>
  <div id="dock">
   <div id="composer">
    <div id="chips"></div>
    <div id="inrow">
     <button id="mode" type="button">說</button>
     <input id="free" type="text" maxlength="120" placeholder="E.【自由輸入】" autocomplete="off" enterkeyhint="send">
     <button id="send" type="button">送</button>
    </div>
   </div>
   <nav id="tabs">
    <button type="button" data-tab="place">地點</button>
    <button type="button" data-tab="call">聯絡</button>
    <button type="button" data-tab="log">紀錄</button>
    <button type="button" data-tab="people">人物</button>
   </nav>
  </div>
 </section>
 <div id="sheet"><div id="shBox"><div id="shH"><h2 id="shT">選單</h2><button id="shX" type="button">✕</button></div><div id="shB"></div></div></div>
 <div id="toast"></div>
 <div id="busy">連線中</div>
 <div id="testResult"></div>
</div>
<script>
/*@@SCRIPT@@*/
</script>
</body>
</html>
