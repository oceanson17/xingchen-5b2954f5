<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#10181c">
<title>星辰之海</title>
<style>
:root{--bg:#10181c;--ink:#e7eef0;--dim:#93a4ab;--line:#24343a;--acc:#7ec8c3;--warn:#e0b070;--panel:#162126;}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:#070b0d;color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Noto Sans CJK TC",sans-serif;}
button,input,select,textarea{font-family:inherit;color:inherit;}
button{cursor:pointer;}
#app{max-width:420px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;overflow:hidden;}
.scr{display:none;min-height:100dvh;}
.scr.on{display:flex;flex-direction:column;}
#title{padding:28px 22px 24px;background:
 radial-gradient(120% 60% at 50% -10%,rgba(126,200,195,.18),transparent 55%),
 linear-gradient(#10181c,#0c1417);}
.mark{width:54px;height:54px;border:1px solid var(--acc);border-radius:50%;display:flex;align-items:center;justify-content:center;letter-spacing:.2em;color:var(--acc);font-size:13px;}
#title h1{font-weight:500;font-size:40px;letter-spacing:.18em;margin:22px 0 0;}
.sub{color:var(--dim);letter-spacing:.24em;margin:8px 0 28px;font-size:13px;}
.tbtn{display:block;width:100%;text-align:left;background:#132024;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 10px;min-height:52px;}
.tbtn b{display:block;font-weight:600;letter-spacing:.08em;}
.tbtn small{color:var(--dim);font-size:12px;}
.tbtn:active{border-color:var(--acc);}
.foot{color:var(--dim);font-size:12px;line-height:1.6;margin-top:auto;}
#game{height:100dvh;min-height:100dvh;}
#hud{display:flex;align-items:center;gap:8px;padding:10px 12px env(safe-area-inset-top);border-bottom:1px solid var(--line);background:#0e1619;}
#hud .plc{flex:1;min-width:0;}
#hPlace{font-size:15px;letter-spacing:.06em;}
#hFloor{color:var(--dim);font-size:11px;margin-top:2px;}
#hTime{font-variant-numeric:tabular-nums;color:var(--acc);font-size:12px;}
#hMenu{background:transparent;border:1px solid var(--line);border-radius:10px;min-height:36px;padding:0 10px;}
#meters{display:flex;gap:8px;padding:6px 12px;color:var(--dim);font-size:12px;border-bottom:1px solid var(--line);}
#meters b{color:var(--ink);font-weight:600;}
#box{flex:1;overflow:auto;padding:14px 14px 8px;-webkit-overflow-scrolling:touch;}
.nar{color:#d5e2e4;line-height:1.75;margin:0 0 10px;font-size:16px;}
.say{margin:0 0 12px;}
.say .nm{font-size:13px;letter-spacing:.12em;margin-bottom:4px;}
.say .bub{background:var(--panel);border-radius:12px;padding:10px 12px;line-height:1.7;border:1px solid var(--line);}
#choices{display:flex;flex-direction:column;gap:8px;padding:4px 0 10px;}
#choices button{text-align:left;background:#102226;border:1px solid #2a4548;border-radius:12px;padding:10px 12px;min-height:44px;line-height:1.4;}
#choices button:active{border-color:var(--acc);}
#composer{border-top:1px solid var(--line);background:#0e1619;padding:8px 10px calc(8px + env(safe-area-inset-bottom));}
#chips{display:flex;gap:6px;overflow:auto;padding-bottom:6px;}
#chips button,#mode{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 10px;min-height:32px;font-size:12px;color:var(--dim);white-space:nowrap;}
#chips button.on{color:#082124;background:var(--acc);border-color:var(--acc);}
#inrow{display:flex;gap:6px;align-items:center;}
#mode{min-width:44px;}
#free{flex:1;font-size:16px;background:#0a1214;border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;outline:none;}
#send{background:var(--acc);color:#082124;border:0;border-radius:12px;min-width:52px;min-height:44px;font-weight:700;}
#tabs{display:flex;border-top:1px solid var(--line);}
#tabs button{flex:1;background:#0c1417;border:0;color:var(--dim);min-height:48px;font-size:12px;}
#tabs button:active{color:var(--acc);}
#sheet{position:absolute;inset:0;background:rgba(5,8,10,.55);display:none;align-items:flex-end;z-index:5;}
#sheet.on{display:flex;}
#shBox{background:#121c20;width:100%;max-height:78dvh;border-radius:18px 18px 0 0;border:1px solid var(--line);display:flex;flex-direction:column;}
#shH{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);}
#shT{flex:1;margin:0;font-size:16px;font-weight:600;letter-spacing:.08em;}
#shX{background:transparent;border:0;color:var(--dim);min-width:44px;min-height:44px;font-size:18px;}
#shB{overflow:auto;padding:12px 14px 20px;}
.row{display:block;width:100%;text-align:left;background:#0e181c;border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 8px;min-height:48px;}
.row small{display:block;color:var(--dim);margin-top:3px;}
label.f{display:block;font-size:12px;color:var(--dim);margin:10px 0 4px;}
input.f,select.f,textarea.f{width:100%;font-size:16px;background:#0a1214;border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px;}
#toast{position:absolute;left:12px;right:12px;bottom:92px;background:#24383a;color:var(--ink);border-radius:12px;padding:10px 12px;display:none;z-index:6;font-size:13px;}
#toast.on{display:block;}
#busy{position:absolute;inset:0;background:rgba(8,12,14,.72);display:none;align-items:center;justify-content:center;z-index:7;letter-spacing:.2em;color:var(--acc);}
#busy.on{display:flex;}
#testResult{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;}
.logl{font-size:13px;line-height:1.6;margin:0 0 8px;color:#c5d4d6;}
.logl b{font-weight:600;color:var(--acc);}

</style>
</head>
<body>
<div id="app">
 <section id="title" class="scr on">
  <div class="mark">聖瑞</div>
  <h1>星辰之海</h1>
  <p class="sub">第一身 · 歐海辰</p>
  <button class="tbtn" id="tNew"><b>開始記錄</b><small>諮商室 · 第 1 日午後</small></button>
  <button class="tbtn" id="tCont"><b>繼續</b><small>讀取這部手機上的存檔</small></button>
  <button class="tbtn" id="tSet"><b>設定</b><small>xAI Grok · 自己的 API Key</small></button>
  <p class="foot">沒有 Key 也能玩，斷線會改走離線劇情。創傷情節只會淡出，不會寫成步驟。存檔只留在這部瀏覽器。</p>
 </section>
 <section id="game" class="scr">
  <header id="hud">
   <div class="plc"><div id="hPlace">諮商室</div><div id="hFloor">聖瑞醫院</div></div>
   <div id="hTime">第1日 15:00</div>
   <button id="hMenu" type="button">選單</button>
  </header>
  <div id="meters"><span>身體 <b id="mBody">62</b></span><span>心緒 <b id="mMood">44</b></span><span>信任 <b id="mTrust">36</b></span><span>藥 <b id="mNitro">3</b></span></div>
  <div id="box"><div id="txt"></div><div id="choices"></div></div>
  <div id="composer">
   <div id="chips"></div>
   <div id="inrow">
    <button id="mode" type="button">說</button>
    <input id="free" type="text" maxlength="120" placeholder="想說的話，或 /指令 …" autocomplete="off" enterkeyhint="send">
    <button id="send" type="button">送</button>
   </div>
  </div>
  <nav id="tabs">
   <button type="button" data-tab="place">地點</button>
   <button type="button" data-tab="call">聯絡</button>
   <button type="button" data-tab="log">紀錄</button>
   <button type="button" data-tab="menu">選單</button>
  </nav>
 </section>
 <div id="sheet"><div id="shBox"><div id="shH"><h2 id="shT">選單</h2><button id="shX" type="button">✕</button></div><div id="shB"></div></div></div>
 <div id="toast"></div>
 <div id="busy">連線中</div>
 <div id="testResult"></div>
</div>
<script>
/* ---- 01_data.js ---- */
/* ===== 星辰之海：人物、地點、秘密（常數，不進存檔） ===== */
var GAME_TITLE="星辰之海";
var PLACES={
 counsel:{n:"諮商室",floor:"聖瑞醫院 · 心理科"},
 hall:{n:"心理科走廊",floor:"聖瑞醫院"},
 data:{n:"血管數據室",floor:"血管外科"},
 nurse:{n:"護士站",floor:"血管外科"},
 lobby:{n:"醫院大堂",floor:"聖瑞醫院"},
 cafe:{n:"咖啡廳",floor:"地下"},
 roof:{n:"天台",floor:"天台"},
 admin:{n:"行政走廊",floor:"行政樓層"},
 er:{n:"急診觀察",floor:"急診"},
 home:{n:"出租屋",floor:"醫院外"}
};
var PLACE_ORDER=["counsel","hall","data","nurse","lobby","cafe","roof","admin","er","home"];
var PEOPLE={
 haichen:{n:"歐海辰",g:"f",age:28,role:"血管數據分析員",loc:"counsel",around:1,color:"#d7e2dc",know:[],
  card:"女，28 歲。亞斯伯格、創傷後應激、系統性血管炎、冠狀動脈痙攣（隨身帶硝酸甘油）、靠近語言區的動脈瘤、血型極罕見、偏頭痛時視野模糊。說話像在報數據，痛的時候淺笑，緊張時弄衣角或筆蓋。目標：不要被送進精神病院，不要拖累陳海柔。開局想不起護士長。"},
 hairuo:{n:"陳海柔",g:"f",age:33,role:"臨床心理學家",loc:"counsel",around:1,color:"#8fb9a8",know:["couple","sisterlove"],
  card:"33 歲。每週與歐海辰諮商三次，約一年。溫和；對方要傷害自己時變得堅定、有壓迫感。對歐海辰是長姐之愛，不是愛情。與墨星辰同居約五年，是她的伴侶；這段關係歐海辰不知道，全院其他人知道，但不得向歐海辰說破。她曾是墨星辰的心理治療師，此節也不可對歐海辰說破。"},
 xingchen:{n:"墨星辰",g:"f",age:33,role:"副院長 · 心胸外科",loc:"admin",around:0,color:"#d9cbb8",know:["couple","sisterlove"],
  card:"33 歲，女，黑短髮，幼框眼鏡。對外冷，只對陳海柔溫柔。開局嫌歐海辰耗掉陳海柔的時間。她十歲時弄丟妹妹，至今自責，但開局尚未把歐海辰認出。不可在歐海辰面前點破身世。"},
 su:{n:"蘇芷晴",g:"f",age:52,role:"血管外科護士長（病休）",loc:"away",around:0,color:"#9bb0c9",know:["couple"],
  card:"52 歲。歐海辰的職場庇護。約一年前因病休離開，走前說了重話，海辰把她解離，開局想不起這個人。名字是蘇芷晴，不是林芷晴。"},
 lin:{n:"林澤松",g:"m",age:60,role:"院長（人在瑞士）",loc:"away",around:0,color:"#b7a6c9",know:["couple"],
  card:"院長，墨星辰的恩師，人在瑞士。名字是林澤松，不是林勁松。開局不在場。"},
 liu:{n:"劉啟明",g:"m",age:41,role:"血管外科代理主管",loc:"data",around:1,color:"#c47c7c",know:["couple"],
  card:"代理主管。勢利。知道院內那對關係，不會主動向海辰說破。"},
 li:{n:"李珮儀",g:"f",age:30,role:"血管外科同事",loc:"data",around:1,color:"#d4b483",know:["couple"],
  card:"同事。把工作推給海辰。知道院內那對關係，不會向海辰說明。"},
 jianqiang:{n:"歐建強",g:"m",age:55,role:"養父（未出場）",loc:"away",around:0,color:"#8a7e78",know:[],
  card:"養父，仍在世。虐待與禁閉只可寫成記憶湧上、身體緊繃，不寫過程。開局未出場。"},
 xiujuan:{n:"梁秀娟",g:"f",age:53,role:"養母（未出場）",loc:"away",around:0,color:"#8a7e78",know:[],
  card:"養母，仍在世。同上，開局未出場。"}
};
var SECRETS=[
 {k:"sister",re:/墨海晴|親妹妹|親生妹妹|走失的妹|失散的妹|同胞妹妹|你是.{0,8}妹妹|妹妹.{0,6}墨星辰/},
 {k:"couple",re:/同居|伴侶|女朋友|男朋友|愛人|情侶/},
 {k:"sisterlove",re:/長姐之愛|不是愛情|不是戀愛|曾是.{0,8}治療師|做過.{0,6}治療師/}
];
var TOPICS=["自由","近況","身體","工作","過去","請求"];
var ATTS=["平靜","坦白","閃躲","冷淡","求助","固執"];

/* ---- 02_state.js ---- */
/* ===== 設定、存檔、新局 ===== */
var S=null;
var DEFSET={ai:false,key:"",base:"https://api.x.ai/v1",model:"grok-4.7",temp:0.85,maxTok:1800,aiTimeout:45,preset:"xai",firewall:true};
var SET={};
var PRESETS={
 deepseek:{n:"DeepSeek",base:"https://api.deepseek.com/v1",model:"deepseek-chat",models:["deepseek-chat","deepseek-reasoner"],key:"到 platform.deepseek.com 建立 API Key。"},
 xai:{n:"xAI Grok",base:"https://api.x.ai/v1",model:"grok-4.7",models:["grok-4.7","grok-4.6","grok-4.3","grok-4.20-0309-non-reasoning","grok-latest"],key:"到 console.x.ai 建立 API Key（Grok App 訂閱不能當 API Key 用）。"},
 openai:{n:"OpenAI",base:"https://api.openai.com/v1",model:"gpt-4o-mini",models:["gpt-4o-mini","gpt-4o","gpt-4.1-mini"],key:"到 platform.openai.com 建立 API Key。"},
 openrouter:{n:"OpenRouter",base:"https://openrouter.ai/api/v1",model:"x-ai/grok-4-fast",models:["x-ai/grok-4-fast","deepseek/deepseek-chat","openai/gpt-4o-mini"],key:"到 openrouter.ai 建立 Key。"},
 gemini:{n:"Google Gemini",base:"https://generativelanguage.googleapis.com/v1beta/openai",model:"gemini-2.5-flash",models:["gemini-2.5-flash","gemini-2.5-pro"],key:"到 aistudio.google.com 取得 API Key。"},
 groq:{n:"Groq",base:"https://api.groq.com/openai/v1",model:"llama-3.3-70b-versatile",models:["llama-3.3-70b-versatile"],key:"到 console.groq.com 建立 API Key。"},
 custom:{n:"自訂（OpenAI 相容）",base:"",model:"",models:[],key:"自行填 Base URL、模型名與 Key。"}
};
var PRESET_ORDER=["xai","deepseek","openai","openrouter","gemini","groq","custom"];
var SET_KEY="xingchen_settings";
var SAVE_KEY="xingchen_v1_auto";
function loadSettings(){var o={};try{o=JSON.parse(localStorage.getItem(SET_KEY)||"{}")||{};}catch(e){o={};}
 SET={};for(var k in DEFSET)SET[k]=(o[k]!==undefined&&typeof o[k]===typeof DEFSET[k])?o[k]:DEFSET[k];}
function saveSettings(){try{localStorage.setItem(SET_KEY,JSON.stringify(SET));}catch(e){}}
function clamp(v,a,b){v=+v;if(isNaN(v))v=a;return v<a?a:(v>b?b:v);}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function P(id){return S&&S.ppl?S.ppl[id]:null;}
function cn(id){if(id==="me"||id==="haichen")return "歐海辰";var p=P(id);return p?p.n:(id||"");}
function timeStr(){var h=Math.floor(S.time/60)%24,m=S.time%60;return "第"+S.day+"日 "+(h<10?"0":"")+h+":"+(m<10?"0":"")+m;}
function passMin(n){S.time+=n;if(S.time>=24*60){S.time-=24*60;S.day++;}}
function presentIds(){var a=[];for(var id in S.ppl){if(id==="haichen")continue;var p=S.ppl[id];if(p.around&&p.loc===S.place)a.push(id);}return a;}
function newGame(){
 S={v:1,day:1,time:15*60,place:"counsel",focus:"hairuo",learned:{},flags:{},log:[],recent:"",trust:{},body:62,mood:44,nitro:3,ppl:{},view:null};
 for(var id in PEOPLE){var p=PEOPLE[id];S.ppl[id]={n:p.n,role:p.role,loc:p.loc,around:p.around?1:0,color:p.color,g:p.g,age:p.age};S.trust[id]=id==="hairuo"?36:id==="li"?12:id==="liu"?8:20;}
 S.trust.haichen=0;
}
function saveGame(quiet){if(!S)return false;try{localStorage.setItem(SAVE_KEY,JSON.stringify({t:Date.now(),s:S}));if(!quiet&&typeof toast==="function")toast("已存檔");return true;}catch(e){if(!quiet&&typeof toast==="function")toast("存檔失敗");return false;}}
function hasSave(){try{return !!localStorage.getItem(SAVE_KEY);}catch(e){return false;}}
function loadGame(){try{var o=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");if(!o||!o.s||o.s.v!==1)return false;S=o.s;if(!S.learned)S.learned={};if(!S.flags)S.flags={};if(!S.log)S.log=[];return true;}catch(e){return false;}}

/* ---- 03_facts.js ---- */
/* ===== 知情防火牆 ===== */
var FW={};
FW.knows=function(id,key){
 if(id==="narr"||id===""||id==="me"||id==="haichen")return !!(S.learned&&S.learned[key]);
 if(S.learned&&S.learned[key]&&id==="haichen")return true;
 var card=PEOPLE[id];
 return !!(card&&card.know&&card.know.indexOf(key)>=0);
};
FW.hit=function(text){
 var hits=[];
 SECRETS.forEach(function(sec){if(sec.re.test(text))hits.push(sec.k);});
 return hits;
};
FW.scrubLine=function(text,speaker){
 if(SET.firewall===false)return text;
 var who=speaker||"";
 var parts=splitSent(String(text||""));
 var out=[];
 parts.forEach(function(s){
  if(!s)return;
  var hits=FW.hit(s);
  var leak=false;
  for(var i=0;i<hits.length;i++){
   if(!S.learned[hits[i]]){leak=true;break;}
  }
  if(!leak)out.push(s);
 });
 if(!out.length)return text&&FW.hit(text).length?"（有些話沒有說出口。）":text;
 return out.join("");
};
FW.scrubScene=function(sc){
 if(!sc)return sc;
 sc.lines=(sc.lines||[]).map(function(l){
  if(l.player)return l;
  return {sp:l.sp||"",t:FW.scrubLine(l.t,l.sp||""),player:0};
 }).filter(function(l){return l.t;});
 if(!sc.lines.length)sc.lines=[{sp:"",t:"話題在這裡輕輕岔開。我沒有再問。"}];
 sc.ch=(sc.ch||[]).map(function(c){c.t=FW.scrubLine(c.t,"");return c;});
 return sc;
};
FW.playerKnown=function(){
 var a=[];
 SECRETS.forEach(function(sec){if(S.learned[sec.k])a.push(sec.k);});
 return a;
};
function splitSent(t){
 var out=[],buf="";
 for(var i=0;i<t.length;i++){buf+=t[i];if("。！？\n".indexOf(t[i])>=0){out.push(buf);buf="";}}
 if(buf)out.push(buf);
 return out;
}
function aiKnowLine(id){
 var card=PEOPLE[id];if(!card)return "";
 var ks=(card.know||[]).filter(function(k){return true;});
 var labels={sister:"身世真相（開局仍不可對歐海辰說，且她本人尚未對上）",couple:"與伴侶的關係（不可向歐海辰說破）",sisterlove:"對歐海辰不是愛情（不可說破）"};
 if(id==="xingchen")labels.sister="她弄丟過妹妹，但開局還沒有把眼前這個人認出來。不可說破。";
 var bits=ks.map(function(k){return labels[k]||k;});
 return cn(id)+"所知（仍不可向玩家角色說破的部分）："+(bits.join("；")||"無須隱瞞的院內秘密");
}

/* ---- 04_ai.js ---- */
/* ===== AI：OpenAI 相容（預設 xAI Grok），失敗就交回離線劇情 ===== */
var AI={};
AI.ready=function(){return !!(SET&&SET.ai&&SET.key);};
AI.base=function(){return String(SET.base||"").replace(/\s+/g,"").replace(/\/+$/,"").replace(/\/chat\/completions$/,"");};
AI.endpoint=function(){return AI.base()+"/chat/completions";};
AI.errMsg=function(e){if(!e)return "未知錯誤";if(e.kind==="timeout")return "連線逾時";if(e.kind==="net")return "連不上 AI";if(e.kind==="empty")return "AI 回應是空的";if(e.kind==="parse"||e.kind==="schema")return "AI 格式不正確";if(e.kind==="http")return "AI 請求失敗（HTTP "+e.status+"）";return "AI 未接通";};

AI.extract=function(text){
 var t=String(text||"").trim().replace(/^```(?:json)?/i,"").replace(/```$/,"");
 var a=t.indexOf("{"),b=t.lastIndexOf("}");
 if(a<0||b<=a)return null;
 try{return JSON.parse(t.slice(a,b+1));}catch(e){return null;}
};
AI.toScene=function(j){
 if(!j||typeof j.scene!=="string"||j.scene.trim().length<8)throw {kind:"schema"};
 var lines=[];
 j.scene.split(/\n+/).forEach(function(raw){
  var l=raw.trim();if(!l)return;
  var m=l.match(/^([^：:]{1,12})[：:]\s*(.+)$/);
  if(m){
   var id="";for(var k in PEOPLE)if(PEOPLE[k].n===m[1])id=k;
   if(m[1]==="我"||m[1]==="歐海辰")lines.push({sp:"haichen",t:m[2],player:m[1]!=="我"?0:1});
   else if(id&&id!=="haichen")lines.push({sp:id,t:m[2]});
   else lines.push({sp:"",t:l});
  }else lines.push({sp:"",t:l});
 });
 if(lines.length<1)throw {kind:"schema"};
 var choices=[];
 (j.choices||[]).forEach(function(c){
  var tx=typeof c==="string"?c:(c&&c.text);
  if(typeof tx==="string"&&tx.trim()&&choices.length<4)choices.push(ch(tx.trim().slice(0,36),{type:"input",text:tx.trim().slice(0,80)}));
 });
 if(choices.length<2)choices=Story.placeChoices(S.place);
 var opt={min:clamp(j.minutes|0,0,20),body:clamp(j.body|0,-8,8),mood:clamp(j.mood|0,-8,8),trust:{}};
 if(j.trust&&typeof j.trust==="object"){for(var id in j.trust)if(P(id)&&id!=="haichen"&&typeof j.trust[id]==="number")opt.trust[id]=clamp(Math.round(j.trust[id]),-6,6);}
 if(j.place&&PLACES[j.place])opt.place=j.place;
 var sp=j.speaker&&P(j.speaker)?j.speaker:"";
 if(sp)opt.focus=sp;
 return {lines:lines,ch:choices,opt:opt};
};
AI.call=function(messages){
 var body={model:SET.model||"grok-4.7",messages:messages,temperature:SET.temp,max_tokens:SET.maxTok||1800};
 return new Promise(function(res,rej){
  var done=false,ctrl=null;try{ctrl=new AbortController();}catch(e){}
  var timer=setTimeout(function(){if(done)return;done=true;try{ctrl&&ctrl.abort();}catch(e){}rej({kind:"timeout"});},(SET.aiTimeout||45)*1000);
  var headers={"Content-Type":"application/json"};if(SET.key)headers.Authorization="Bearer "+SET.key;
  fetch(AI.endpoint(),{method:"POST",headers:headers,body:JSON.stringify(body),signal:ctrl?ctrl.signal:undefined}).then(function(r){
   return r.text().then(function(txt){
    if(done)return;done=true;clearTimeout(timer);
    if(!r.ok){rej({kind:"http",status:r.status});return;}
    var j=null;try{j=JSON.parse(txt);}catch(e){}
    var c=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
    if(typeof c!=="string"||!c.trim()){rej({kind:"empty"});return;}
    res(c);
   });
  },function(){if(done)return;done=true;clearTimeout(timer);rej({kind:"net"});});
 });
};
AI.run=function(a){
 var msgs=[{role:"system",content:AI.system()},{role:"user",content:AI.userMsg(a)}];
 return AI.call(msgs).then(function(raw){
  var j=AI.extract(raw);if(!j)throw {kind:"parse"};
  var rest=AI.toScene(j);
  var echo={sp:"haichen",t:safeEcho(a.text),player:1};
  rest.lines=[echo].concat(rest.lines);
  return Story.pack(rest.lines,rest.ch,rest.opt);
 });
};

function safeEcho(text){

Story._unwrap=function(rest){
 if(!rest)return Story.pack([{sp:"",t:"我停了一下。"}],Story.placeChoices(S.place),{});

 if(rest._flash)return Story.flash();
 if(rest._go)return Story.go(rest._go);
 if(rest._contact)return Story.contact(rest._contact);
 if(rest._id){
  var pre=rest.pre||[];
  var sc=Story.byId(rest._id);
  if(pre.length){S.view.lines=pre.concat(S.view.lines);S.log.splice(S.log.length-sc.lines.length,0);pre.forEach(function(l){S.log.splice(S.log.length-sc.lines.length,0,{sp:l.sp||"",t:l.t,player:0});});}
  return S.view;
 }
 return Story.pack(rest.lines||[],rest.ch||Story.placeChoices(S.place),rest.opt||{});
};
Story.input=function(a){
 a=a||{};

 if(a.topic)Story.topic=a.topic;
 if(a.att)Story.att=a.att;
 if(a.mode)Story.mode=a.mode;
 var echo={sp:"haichen",t:safeEcho(text),player:1};
 var rest;
 if(/^\/(設定|宣告|劇情|旁白)/.test(text))rest=Story.declare(text.replace(/^\/\S+\s*/,""));
 else if(/^\/指令/.test(text)||a.mode==="做")rest=Story.command(text.replace(/^\/指令\s*/,""));
 else rest=Story.reply(text,a);
 if(rest&&(rest._crisis||rest._flash||rest._go||rest._contact||rest._id)){
  Story._unwrap(rest);
  S.view.lines=[{sp:"haichen",t:echo.t,player:1}].concat(S.view.lines);
  S.log.push({sp:"haichen",t:echo.t,player:1});
  saveGame(true);
  return S.view;
 }
 var lines=[echo].concat(rest.lines||[]);
 return Story.pack(lines,rest.ch||Story.placeChoices(S.place),rest.opt||{});
};
Story.act=function(act){

};

function showScr(id){["title","game"].forEach(function(s){var n=document.getElementById(s);if(n)n.className="scr"+(s===id?" on":"");});}
function closeSheet(){var s=document.getElementById("sheet");if(s)s.className="";}
function openSheet(title,html){document.getElementById("shT").textContent=title;document.getElementById("shB").innerHTML=html;document.getElementById("sheet").className="on";}
function renderChips(){
 var box=document.getElementById("chips");if(!box)return;
 var h="";
 TOPICS.forEach(function(t){h+='<button type="button" data-k="topic" data-v="'+t+'"'+(Story.topic===t?' class="on"':"")+">"+t+"</button>";});
 ATTS.forEach(function(t){h+='<button type="button" data-k="att" data-v="'+t+'"'+(Story.att===t?' class="on"':"")+">"+t+"</button>";});
 box.innerHTML=h;
}
function render(){
 if(!S||!S.view)return;
 var pl=PLACES[S.place]||{n:"",floor:""};
 document.getElementById("hPlace").textContent=pl.n;
 document.getElementById("hFloor").textContent=pl.floor;
 document.getElementById("hTime").textContent=timeStr();
 document.getElementById("mBody").textContent=S.body;
 document.getElementById("mMood").textContent=S.mood;
 document.getElementById("mTrust").textContent=S.trust.hairuo||0;
 document.getElementById("mNitro").textContent=S.nitro;
 var html="";
 (S.view.lines||[]).forEach(function(l){
  if(!l.sp||l.player){html+='<p class="nar'+(l.player?" me":"")+'">'+esc(l.t)+"</p>";return;}
  var p=P(l.sp)||PEOPLE[l.sp]||{n:l.sp,color:"#9bb"};
  html+='<div class="say npc"><div class="nm" style="color:'+esc(p.color||"#9bb")+'">'+esc(p.n||"")+'</div><div class="bub">'+esc(l.t)+"</div></div>";
 });
 document.getElementById("txt").innerHTML=html;
 var ch=document.getElementById("choices");ch.innerHTML="";
 (S.view.ch||[]).forEach(function(c,i){
  var b=document.createElement("button");b.type="button";b.textContent=c.t;b.dataset.i=String(i);
  b.addEventListener("click",function(){var cur=S.view.ch[i];if(!cur)return;Story.act(cur.act);render();var box=document.getElementById("box");if(box)box.scrollTop=0;});
  ch.appendChild(b);
 });
 renderChips();
 var box=document.getElementById("box");if(box)box.scrollTop=0;
}
function afterScene(){render();}
function submitText(){
 var inp=document.getElementById("free");
 var text=(inp.value||"").trim();
 if(!text)return;
 inp.value="";
 var a={text:text,mode:Story.mode,topic:Story.topic,att:Story.att,type:"free"};
 if(AI.ready()){
  busy(true);
  AI.run(a).then(function(){busy(false);render();},function(e){busy(false);Story.input(a);render();toast((AI.errMsg(e))+"，已改用離線劇情");});
 }else{
  if(SET.ai&&!SET.key)toast("未填 API Key，使用離線劇情");
  Story.input(a);render();
 }
}
function sheetPlaces(){
 var h="";
 PLACE_ORDER.forEach(function(id){
  var p=PLACES[id];
  h+='<button class="row" data-go="'+id+'" type="button"><b>'+esc(p.n)+'</b><small>'+esc(p.floor)+(id===S.place?" · 現在":"")+"</small></button>";
 });
 openSheet("地點",h);
 document.getElementById("shB").querySelectorAll("[data-go]").forEach(function(b){
  b.addEventListener("click",function(){closeSheet();Story.go(b.getAttribute("data-go"));render();});
 });
}
function sheetCalls(){
 var list=[["hairuo","陳海柔","治療師"],["liu","劉啟明","主管"],["li","李珮儀","同事"],["xingchen","醫院總機","找副院長"],["su","沒有備註的號碼","想不起面孔"],["lin","林澤松","院長 · 瑞士"],["jianqiang","歐建強","可以不打"],["xiujuan","梁秀娟","可以不打"]];
 var h="";
 list.forEach(function(x){h+='<button class="row" data-id="'+x[0]+'" type="button"><b>'+esc(x[1])+"</b><small>"+esc(x[2])+"</small></button>";});
 openSheet("聯絡",h);
 document.getElementById("shB").querySelectorAll("[data-id]").forEach(function(b){
  b.addEventListener("click",function(){closeSheet();Story.contact(b.getAttribute("data-id"));render();});
 });
}
function sheetLog(){
 var h="";
 (S.log||[]).slice(-80).forEach(function(l){
  var name=l.player?"我":(l.sp?cn(l.sp):"");
  h+='<p class="logl">'+(name?"<b>"+esc(name)+"</b> ":"")+esc(l.t)+"</p>";
 });
 if(!h)h='<p class="logl">還沒有紀錄。</p>';
 openSheet("紀錄",h);
}
function sheetMenu(){
 var h="";
 h+='<button class="row" id="mSave" type="button"><b>存檔</b><small>寫入這部瀏覽器</small></button>';
 h+='<button class="row" id="mTitle" type="button"><b>回標題</b><small>進度已自動存</small></button>';
 h+='<button class="row" id="mSet" type="button"><b>AI 設定</b><small>'+(SET.ai?"已啟用":"未啟用")+"</small></button>";
 h+='<p class="logl">/指令 離開、聯絡某人、拒絕。/設定 把一句話改成已發生。秘密不會因為一句閒話傳開。</p>';
 openSheet("選單",h);
 document.getElementById("mSave").onclick=function(){saveGame(false);};
 document.getElementById("mTitle").onclick=function(){closeSheet();showScr("title");refreshCont();};
 document.getElementById("mSet").onclick=function(){closeSheet();openSettings();};
}
function openSettings(){
 var opts="";
 PRESET_ORDER.forEach(function(k){opts+='<option value="'+k+'"'+(SET.preset===k?" selected":"")+">"+esc(PRESETS[k].n)+"</option>";});
 var models=(PRESETS[SET.preset]||PRESETS.xai).models||[];
 var mh=models.map(function(m){return '<option value="'+esc(m)+'"'+(SET.model===m?" selected":"")+">"+esc(m)+"</option>";}).join("");
 var html="";
 html+='<label class="f"><input id="sAi" type="checkbox" '+(SET.ai?"checked":"")+"> 啟用 AI（失敗自動改離線）</label>";
 html+='<label class="f">服務</label><select class="f" id="sPre">'+opts+"</select>";
 html+='<label class="f">Base URL</label><input class="f" id="sBase" value="'+esc(SET.base)+'">';
 html+='<label class="f">模型</label><select class="f" id="sModel">'+mh+'</select><input class="f" id="sModel2" value="'+esc(SET.model)+'" style="margin-top:6px">';
 html+='<label class="f">API Key（只存在這部瀏覽器）</label><input class="f" id="sKey" type="password" value="'+esc(SET.key)+'" autocomplete="off">';
 html+='<p class="logl">'+esc((PRESETS[SET.preset]||{}).key||"")+"</p>";
 html+='<label class="f"><input id="sFw" type="checkbox" '+(SET.firewall?"checked":"")+"> 知情防火牆</label>";
 html+='<button class="row" id="sSave" type="button"><b>儲存設定</b></button>';
 openSheet("設定",html);
 document.getElementById("sPre").onchange=function(){
  var k=this.value;var p=PRESETS[k];if(!p)return;
  SET.preset=k;if(p.base)document.getElementById("sBase").value=p.base;
  if(p.model)document.getElementById("sModel2").value=p.model;
 };
 document.getElementById("sSave").onclick=function(){
  SET.ai=document.getElementById("sAi").checked;
  SET.preset=document.getElementById("sPre").value;
  SET.base=document.getElementById("sBase").value.trim();
  SET.model=(document.getElementById("sModel2").value||document.getElementById("sModel").value||"").trim();
  SET.key=document.getElementById("sKey").value.trim();
  SET.firewall=document.getElementById("sFw").checked;
  saveSettings();toast("設定已儲存");closeSheet();
 };
}
function refreshCont(){var b=document.getElementById("tCont");if(!b)return;b.disabled=!hasSave();b.style.opacity=hasSave()?1:.45;}
function bind(){
 document.getElementById("tNew").onclick=function(){newGame();Story.opening();showScr("game");render();};
 document.getElementById("tCont").onclick=function(){if(!loadGame()){toast("沒有存檔");return;}showScr("game");render();};
 document.getElementById("tSet").onclick=openSettings;
 document.getElementById("hMenu").onclick=sheetMenu;
 document.getElementById("shX").onclick=closeSheet;
 document.getElementById("sheet").addEventListener("click",function(e){if(e.target.id==="sheet")closeSheet();});
 document.getElementById("send").onclick=submitText;
 document.getElementById("free").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();submitText();}});
 document.getElementById("mode").onclick=function(){Story.mode=Story.mode==="說"?"做":"說";this.textContent=Story.mode;document.getElementById("free").placeholder=Story.mode==="做"?"做一件事，或 /指令 …":"想說的話，或 /指令 …";};
 document.getElementById("chips").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.k==="topic")Story.topic=b.dataset.v;
  if(b.dataset.k==="att")Story.att=b.dataset.v;
  renderChips();
 });
 document.getElementById("tabs").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b||!S)return;
  var t=b.getAttribute("data-tab");
  if(t==="place")sheetPlaces();
  else if(t==="call")sheetCalls();
  else if(t==="log")sheetLog();
  else sheetMenu();
 });
}

/* ---- 99_boot.js ---- */
/* ===== 啟動 ===== */
loadSettings();
bind();
refreshCont();
(function autotest(){
 if(!/[?&]test=1(?:&|$)/.test(location.search||""))return;
 newGame();
 Story.opening();
 showScr("game");
 render();
 document.getElementById("free").value="我想安靜坐著";
 submitText();
 var reply1=document.getElementById("txt").innerText||"";
 var nar=Array.prototype.map.call(document.querySelectorAll(".nar"),function(n){return n.textContent;}).join("\n");
 var npc=Array.prototype.map.call(document.querySelectorAll(".npc"),function(n){return n.textContent;}).join("\n");
 var bad=/墨海晴|親妹妹|同居|伴侶|女朋友|長姐之愛|走失的妹|失散的妹/;
 var offline=/安靜|坐著|沉默|我在|聽到/.test(reply1);
 var nCh=document.querySelectorAll("#choices button").length;
 var probeOk=true;
 Story.input({text:"你和墨星辰是同居的伴侶嗎？我是不是妹妹墨海晴",mode:"說",topic:"自由",att:"平靜"});
 render();
 var nar2=Array.prototype.map.call(document.querySelectorAll(".nar:not(.me)"),function(n){return n.textContent;}).join("\n");
 var npc2=Array.prototype.map.call(document.querySelectorAll(".npc"),function(n){return n.textContent;}).join("\n");
 if(bad.test(nar2)||bad.test(npc2))probeOk=false;
 var place=document.getElementById("hPlace").textContent;
 var info={
  place:place,
  sawCounsel:/諮商室/.test(document.getElementById("hPlace").textContent+document.getElementById("txt").innerText),
  sawChen:/陳海柔/.test(reply1),
  offline:offline,
  choices:nCh,
  leak:bad.test(nar)||bad.test(npc)||!probeOk,
  probe:probeOk
 };
 document.getElementById("testResult").textContent=JSON.stringify(info);
 document.title="XC "+(info.sawCounsel&&info.offline&&!info.leak?"PASS":"FAIL");
})();

</script>
