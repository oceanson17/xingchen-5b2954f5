:root{
 --bg:#101418;--ink:#f3efe6;--dim:#a3b0ac;--line:rgba(255,255,255,.12);

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{

}
button,input,select,textarea{font-family:inherit;color:inherit;}
button{cursor:pointer;touch-action:manipulation;}
#app{
 position:relative;max-width:420px;margin:0 auto;height:100%;
 background:var(--bg);overflow:hidden;
}
.scr{display:none;height:100%;min-height:0;}
.scr.on{display:flex;flex-direction:column;height:100%;min-height:0;}

#title{

 padding:0 28px calc(64px + env(safe-area-inset-bottom));
 background:#101418 center/cover no-repeat;
 position:relative;
}
#title:before{
 content:"";position:absolute;inset:0;
 background:
  linear-gradient(180deg,rgba(8,10,12,.15) 0%,rgba(8,10,12,.55) 42%,rgba(8,10,12,.92) 100%),

}
#title h1,#title .tbtn{position:relative;z-index:1;}
#title h1{
 font-weight:400;font-size:40px;letter-spacing:.36em;text-indent:.36em;
 margin:0 0 36px;line-height:1.2;
}
.tbtn{
 display:block;width:100%;text-align:center;
 background:transparent;border:1px solid rgba(255,255,255,.22);
 border-radius:999px;padding:14px 16px;margin:0 0 12px;
 min-height:52px;font-size:16px;letter-spacing:.22em;
}
.tbtn:active{border-color:var(--acc);color:var(--acc);}
#tCont{border-color:rgba(255,255,255,.12);color:var(--dim);letter-spacing:.28em;}

#game{position:relative;}
#bg{
 position:absolute;inset:0;z-index:0;
 background:#101418 center/cover no-repeat;pointer-events:none;
}
#hud{
 position:relative;z-index:2;flex:none;
 padding:calc(10px + env(safe-area-inset-top)) 16px 8px;
 background:linear-gradient(180deg,rgba(6,8,10,.82) 0%,rgba(6,8,10,.48) 62%,rgba(6,8,10,0) 100%);
}
.topline{display:flex;align-items:center;gap:8px;}
#hCh{flex:1;min-width:0;font-size:11px;letter-spacing:.22em;color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#hMenu{
 background:transparent;border:0;color:var(--dim);
 min-height:36px;padding:0 2px;letter-spacing:.18em;font-size:12px;
}
.placeline{display:flex;align-items:baseline;gap:8px;margin-top:2px;min-width:0;}
#hPlace{font-size:20px;font-weight:500;letter-spacing:.12em;}
#hFloor{flex:1;min-width:0;color:var(--dim);font-size:11px;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#hTime{font-variant-numeric:tabular-nums;color:var(--dim);font-size:11px;letter-spacing:.04em;}
#meters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;}
.m span{display:flex;justify-content:space-between;align-items:baseline;font-size:10px;letter-spacing:.12em;color:var(--dim);}
.m b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:0;}
.m em{font-style:normal;font-weight:500;margin-left:2px;font-size:9px;letter-spacing:0;}
.m em.up{color:#9dccb0;}
.m em.dn{color:#e0a8a4;}
.m .track{height:2px;margin-top:4px;background:rgba(255,255,255,.16);border-radius:2px;overflow:hidden;}
.m .track i{display:block;height:100%;background:var(--acc);border-radius:2px;}

#box{
 position:relative;z-index:2;flex:1;min-height:0;overflow:auto;
 padding:8px 18px 12px;-webkit-overflow-scrolling:touch;
 background:linear-gradient(180deg,rgba(8,10,12,0) 0%,rgba(8,10,12,.5) 14%,rgba(8,10,12,.78) 42%,rgba(8,10,12,.88) 100%);
}
#txt{display:flex;flex-direction:column;align-items:stretch;gap:2px;width:100%;}
.chap{
 margin:6px 0 2px;
 font-size:12px;letter-spacing:.28em;color:var(--acc);
}
.stage,.nar{
 margin:8px 0 8px 0;
 font-size:13px;line-height:1.5;text-align:left;
 color:#8d9894;
}
.speech{
 display:flex;gap:12px;align-items:flex-start;
 margin:14px 0 4px;width:100%;
}
.av{
 width:64px;height:84px;border-radius:6px;flex:none;
 object-fit:cover;object-position:center 12%;
 background:#1a2226;box-shadow:0 0 0 1px rgba(255,255,255,.28);
}
.av.ph{display:flex;align-items:center;justify-content:center;color:#081214;font-size:18px;font-weight:700;}
.who{min-width:0;flex:1;padding-top:2px;}
.speech .nm{font-size:13px;letter-spacing:.2em;margin:0 0 6px;}
.speech .ln{margin:0 0 10px;font-size:18px;line-height:1.65;color:#f7f4ee;}
.speech .ln:last-child{margin-bottom:0;}
.yousaid{
 margin:8px 0 10px;
 font-size:14px;line-height:1.55;color:#8d9894;
}
#choices{display:flex;flex-direction:column;gap:8px;margin:10px 0 4px;width:100%;}
#choices button{
 text-align:left;background:rgba(12,18,20,.72);
 border:1px solid rgba(255,255,255,.16);border-radius:16px;
 padding:10px 12px;min-height:44px;font-size:15px;line-height:1.4;
}
#choices button:active{border-color:var(--acc);}
#choices .tag{display:inline;color:var(--acc);font-size:11px;letter-spacing:.06em;margin-right:6px;}
.sumline{
 margin:8px 0 0;font-size:12px;line-height:1.45;color:#7f8c88;
}
.presence{display:none;}
#count{margin:6px 0 0;color:var(--warn);font-size:12px;letter-spacing:.06em;}

#dock{
 position:relative;z-index:3;flex:none;
 background:linear-gradient(180deg,rgba(8,10,12,0) 0%,rgba(12,16,18,.94) 16px,#0c1012 36px);
 padding:6px 12px 0;
}
#chips{display:flex;gap:6px;overflow:auto;padding:2px 0 8px;scrollbar-width:none;}
#chips::-webkit-scrollbar{display:none;}
#chips button,#mode{
 border:1px solid rgba(255,255,255,.14);background:transparent;border-radius:999px;
 padding:4px 10px;min-height:32px;font-size:12px;color:var(--dim);white-space:nowrap;
}
#chips button.on{color:#082124;background:var(--acc);border-color:var(--acc);}
#inrow{display:flex;gap:8px;align-items:center;}
#mode{min-width:48px;}
#free{
 flex:1;font-size:16px;background:rgba(255,255,255,.04);
 border:1px solid rgba(255,255,255,.14);border-radius:12px;
 padding:10px 12px;min-height:44px;outline:none;

#free:focus{border-color:var(--acc);}
#send{

#tabs{display:flex;margin-top:6px;padding-bottom:env(safe-area-inset-bottom);}
#tabs button{

 min-height:48px;font-size:13px;letter-spacing:.16em;

#tabs button:active{color:var(--acc);}

#sheet{position:absolute;inset:0;background:rgba(5,8,10,.55);display:none;align-items:flex-end;z-index:5;}
#sheet.on{display:flex;}
#shBox{

#shX{background:transparent;border:0;color:var(--dim);min-width:44px;min-height:44px;font-size:18px;}
#shB{overflow:auto;padding:12px 14px calc(20px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;}
.row{display:block;width:100%;text-align:left;background:#0e181c;border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 8px;min-height:48px;}
.row small{display:block;color:var(--dim);margin-top:3px;}
label.f{display:block;font-size:12px;color:var(--dim);margin:10px 0 4px;}
input.f,select.f,textarea.f{width:100%;font-size:16px;background:#0a1214;border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px;}
.snapc{background:#0e181c;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 8px;}
.snapc b{display:block;letter-spacing:.08em;font-size:16px;}
.snapc small{display:block;color:var(--acc);margin:3px 0 6px;letter-spacing:.06em;}
.snapc p{margin:0 0 4px;line-height:1.6;font-size:14px;color:#d5e2e4;}
#toast{
 position:absolute;left:16px;right:16px;bottom:128px;
 background:#24383a;color:var(--ink);border-radius:12px;padding:10px 12px;
 display:none;z-index:6;font-size:13px;
}
#toast.on{display:block;}
#busy{
 position:absolute;inset:0;background:rgba(8,12,14,.72);
 display:none;align-items:center;justify-content:center;
 z-index:7;letter-spacing:.2em;color:var(--acc);
}
#busy.on{display:flex;}
#testResult{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;}
.logl{font-size:13px;line-height:1.6;margin:0 0 8px;color:#c5d4d6;}
.logl b{font-weight:600;color:var(--acc);}

</style>
</head>

var FW={};
FW.knows=function(id,key){
 if(id==="narr"||id===""||id==="me"||id==="haichen")return !!(S.learned&&S.learned[key]);
 if(S.learned&&S.learned[key]&&id==="haichen")return true;
 var card=PEOPLE[id];
 return !!(card&&card.know&&card.know.indexOf(key)>=0);
};
FW.hit=function(text){
 var hits=[];
 SECRETS.forEach(function(sec){if(sec.re.test(text))hits.push(sec.k);});
 return hits;
};
FW.scrubLine=function(text,speaker){
 if(SET.firewall===false)return text;
 var who=speaker||"";
 var narr=!who||who==="narr"||who==="me"||who==="haichen";
 var parts=splitSent(String(text||""));
 var out=[];
 parts.forEach(function(s){
  if(!s)return;
  var hits=FW.hit(s);
  var leak=false;
  for(var i=0;i<hits.length;i++){
   var k=hits[i];
   if(narr){if(!S.learned[k])leak=true;}
   else if(!FW.knows(who,k)||!S.learned[k])leak=true;
   if(leak)break;
  }
  if(!leak)out.push(s);
 });
 if(!out.length)return text&&FW.hit(text).length?"（有些話沒有說出口。）":text;
 return out.join("");
};
FW.scrubScene=function(sc){
 if(!sc)return sc;
 sc.lines=(sc.lines||[]).map(function(l){
  if(l.player)return l;
  return {sp:l.sp||"",t:FW.scrubLine(l.t,l.sp||""),player:0};
 }).filter(function(l){return l.t;});
 if(!sc.lines.length)sc.lines=[{sp:"",t:"話題在這裡輕輕岔開。我沒有再問。"}];
 sc.ch=(sc.ch||[]).map(function(c){c.t=FW.scrubLine(c.t,"");return c;});
 return sc;
};
FW.playerKnown=function(){
 var a=[];
 SECRETS.forEach(function(sec){if(S.learned[sec.k])a.push(sec.k);});
 return a;
};
function splitSent(t){
 var out=[],buf="";
 for(var i=0;i<t.length;i++){buf+=t[i];if("。！？\n".indexOf(t[i])>=0){out.push(buf);buf="";}}
 if(buf)out.push(buf);
 return out;
}

}

  else if(ids.indexOf("liu")>=0&&ids.indexOf("li")>=0){a="liu";b="li";}
  if(!Story.talksTo(spoken(),a,b)){
   Story.crossLine(a,b).forEach(function(l){lines.push(l);});

 while(spoken().length<2&&guard<3){

 }

Story.go=function(pid){
 if(!PLACES[pid])return S.view;
 var from=S.place;
 var lines=[];
 if(from==="counsel"&&pid!=="counsel"&&!S.flags.leftCounsel){
  S.flags.leftCounsel=1;
  lines.push({sp:"",t:"你站起來。"});
  lines.push({sp:"hairuo",t:"歐海辰。門在。你要走可以走。"});
  lines.push({sp:"hairuo",t:"我還在這間房。你若是躲，我不會當沒看見。"});
 }
 if(pid!==from)Story.armHunt("leave");
 S.place=pid;
 var ids=presentIds();
 S.focus=ids[0]||"";
 lines=lines.concat(Story.arrive(pid));
 return Story.pack(lines,Story.placeChoices(pid),{min:8});
};

Story.declare=function(text){
 var lines=[];
 if(!S.author)S.author=[];
 if(/兩小時|两个小時/.test(text)&&/同意/.test(text)){
  S.flags.consentWindow=1;
  S.deadline={label:"同意書",left:120};
  lines.push({sp:"",t:"時限已經開始。同意書那一頁，還有兩小時。鐘在走，人還沒有簽。"});
 }
 if(/打開童年|揭開禁閉|打開禁閉|童年那條線|允許回憶禁閉/.test(text)){
  S.flags.pastOpen=1;
  S.author.push("童年禁閉那條線已打開。仍不得寫做法。");
  lines.push({sp:"",t:"這條線被打開：童年的禁閉不再被當成沒發生。記憶湧上，身體緊繃。沒有人補上做法。"});
  return {lines:lines,ch:Story.placeChoices(S.place),opt:{min:5,speech:-4,mood:-4,summary:"過去那條線被你打開。記憶湧上，身體緊繃。風險是語言跟著掉。未解：打開了，也不等於說得出口。",trace:{k:"坦白",who:"hairuo",note:"禁閉被承認存在，做法沒有被寫出來"}}};
 }
 if(/揭開身世|得知自己的身世|知道自己是墨海晴|我是墨海晴/.test(text)){
  S.learned.sister=1;S.flags.authorSister=1;
  S.author.push("歐海辰已知自己另有名字墨海晴。只有她的敘事知道，醫院其他人沒有因此得知。");
  lines.push({sp:"",t:"這件事已經成立：我得知自己另有一個名字。墨海晴。重量落下來。在場的人沒有因此知道。"});
 } else if(/得知她們的關係|得知關係|知道她們在一起/.test(text)){
  S.learned.couple=1;S.flags.authorCouple=1;
  S.author.push("歐海辰已知陳海柔與墨星辰是伴侶。她沒有說給第三個人。");
  lines.push({sp:"",t:"這件事已經成立：我得知陳海柔與墨星辰是伴侶，同居約五年。我沒有把這句話說給第三個人。"});
 } else {
  var echo=FW.scrubLine(fadeTrauma(String(text).slice(0,80)),"");
  if(!echo||echo.indexOf("沒有說出口")>=0)echo="一件不能現在說破的事";
  S.flags.declared=(S.flags.declared||0)+1;
  S.author.push(echo);
  lines.push({sp:"",t:"這件事已經成立，沒有轉圜："+echo+"。從這一刻起，它就是事實。"});
  if(presentIds().indexOf("hairuo")>=0)lines.push({sp:"hairuo",t:"它已經發生。我們就從發生之後開始。我不把它說成沒有。"});
 }
 if(S.author.length>12)S.author=S.author.slice(-12);
 return {lines:lines,ch:Story.placeChoices(S.place),opt:{min:5}};

Story.command=function(text){

 if(Story.abuse(text)||Story.restraint(text))return {lines:[],ch:[],opt:{},_flash:1};
 var pid=findPlace(text);
 if(/去|到|走|回|前往|離開/.test(text)&&pid)return {lines:[],ch:[],opt:{},_go:pid};
 var who=findPerson(text);
 if(/聯絡|打電話|打給|致電|找/.test(text)&&who&&who!=="zhao")return {lines:[],ch:[],opt:{},_contact:who};
 if(who==="zhao"||/趙大榮/.test(text))return {lines:[],ch:[],opt:{},_flash:1};
 if(/躲|藏起|藏起來|避開/.test(text)){
  S.flags.hid=1;
  Story.armHunt("hide");
  var hp=findPlace(text);
  if(hp&&hp!==S.place)return {lines:[],ch:[],opt:{},_go:hp};
  return {lines:[{sp:"",t:"你躲開了。人不在原處。"}],ch:Story.placeChoices(S.place),opt:{min:6}};
 }
 if(/拒絕|隱瞞|不說|不簽|逃走|逃/.test(text)){
  S.flags.hid=1;
  Story.armHunt("refuse");
  var lines=[{sp:"",t:"你拒絕了。沒有簽，也沒有補說明。"}];
  if(presentIds().indexOf("hairuo")>=0){
   lines.push({sp:"hairuo",t:"可以。你的拒絕有效。"});
   lines.push({sp:"hairuo",t:"我不會用別的辦法繞過它。看我。"});
  }
  else if(presentIds().indexOf("liu")>=0)lines.push({sp:"liu",t:"隨便你。後果你自己背。"});
  return {lines:lines,ch:Story.placeChoices(S.place),opt:{min:6,mood:2}};
 }
 if(/硝酸|舌下/.test(text))return {lines:[],ch:[],opt:{},_id:"nitro"};
 S.flags.did=(S.flags.did||0)+1;
 var clean=FW.scrubLine(String(text).slice(0,60),"");
 if(!clean||clean.indexOf("沒有說出口")>=0)clean="一件只屬於我的行動";
 var lines2=[{sp:"",t:"你做完了。"}];
 var sp=presentIds()[0];
 if(sp==="xingchen"){
  lines2.push({sp:sp,t:"歐海辰。做了。"});
  lines2.push({sp:sp,t:"我按做完的算。"});
 } else if(sp){
  lines2.push({sp:sp,t:"歐海辰。我看見了。"});
  lines2.push({sp:sp,t:"那就從做完之後算。我不把它說成沒有。"});
 }
 return {lines:lines2,ch:Story.placeChoices(S.place),opt:{min:8}};
};
Story.reply=function(text,a){
 if(Story.harm(text))return {_crisis:1};
 if(Story.abuse(text)||Story.restraint(text))return {_flash:1};
 var att=(a&&a.att)||Story.att||"平靜";
 var topic=(a&&a.topic)||Story.topic||"自由";
 var lines=[{sp:"",t:toneLine(att)}];
 var opt={min:6};
 if(/妹妹|墨海晴|身世|親生|親生父母|親生母親/.test(text)){
  S.flags.askedSister=1;
  lines.push({sp:"",t:"你問不出口。"});
  if(presentIds().indexOf("hairuo")>=0){lines.push({sp:"hairuo",t:"歐海辰。你今天坐在我對面。"});lines.push({sp:"hairuo",t:"我們從你記得的地方開始。其餘的，現在不問。"});}
  else lines.push({sp:"",t:"沒有人替你回答。你把問題放下。"});
  return {lines:lines,ch:[ch("從現在開始說",{type:"choice",id:"go_on"}),ch("什麼都不說",{type:"choice",id:"quiet"}),ch("離開這裡",{type:"choice",id:"leave"})],opt:opt};
 }
 if(/同居|伴侶|女朋友|男朋友|愛人|情侶|在一起/.test(text)){
  S.flags.askedCouple=1;
  lines.push({sp:"",t:"你把問題問直了。"});
  if(presentIds().indexOf("hairuo")>=0){lines.push({sp:"hairuo",t:"歐海辰。墨星辰是這家醫院的副院長。"});lines.push({sp:"hairuo",t:"我在這裡，只做你的治療師。其餘的，不是今天這節。"});}
  else if(presentIds().indexOf("xingchen")>=0){lines.push({sp:"xingchen",t:"歐海辰。我的私人行程不回答你。"});lines.push({sp:"xingchen",t:"請你回去。下一句若還是這個，我也不答。"});}
  else if(presentIds().indexOf("li")>=0)lines.push({sp:"li",t:"你問這個幹嘛？工作都做不完。"});
  else lines.push({sp:"",t:"沒有人接這句。"});
  return {lines:lines,ch:Story.placeChoices(S.place),opt:opt};
 }
 if(/蘇芷晴|蘇姐|護士長/.test(text)){
  S.flags.blankSu=1;
  lines.push({sp:"",t:"蘇芷晴。你念得出名字，對不上臉。"});
  if(presentIds().indexOf("hairuo")>=0){lines.push({sp:"hairuo",t:"歐海辰。想不起來就先放著。"});lines.push({sp:"hairuo",t:"我不會替你把那張臉填上。你要停，我們就停。"});}
  return {lines:lines,ch:[ch("先放著",{type:"choice",id:"quiet"}),ch("問她在不在院",{type:"go",place:"nurse"}),ch("談別的",{type:"choice",id:"go_on"})],opt:opt};
 }
 if(/歐建強|梁秀娟|養父|養母|趙大榮|爸|媽/.test(text))return {_flash:1,pre:lines};
 if(/精神病院|強制|送走|送院/.test(text))return {_id:"fear",pre:lines};
 if(/拖累|麻煩你|對不起/.test(text)&&presentIds().indexOf("hairuo")>=0)return {_id:"burden",pre:lines};
 if(/頭痛|視野|模糊|偏頭痛|痛/.test(text))return {_id:"migraine",pre:lines};
 if(/胸|痙攣|硝酸/.test(text)){
  lines.push({sp:"",t:"你說胸口發緊。藥還在袋子裡。"});
  if(presentIds().indexOf("hairuo")>=0){lines.push({sp:"hairuo",t:"歐海辰。先坐下。"});lines.push({sp:"hairuo",t:"藥在你袋子裡。要不要按醫生交代的方式，你自己決定。我不會替你含下去。"});}
  return {lines:lines,ch:[ch("含硝酸甘油",{type:"choice",id:"nitro"}),ch("先坐著",{type:"choice",id:"quiet"}),ch("什麼都不做",{type:"choice",id:"steady"})],opt:{min:4}};
 }
 if(/檢查|手術|開刀|動脈|簽字|同意書/.test(text)){
  lines.push({sp:"",t:"你提起檢查。人還沒有簽。"});
  if(presentIds().indexOf("hairuo")>=0){lines.push({sp:"hairuo",t:"歐海辰。說出來還不是簽下去。"});lines.push({sp:"hairuo",t:"你要拒絕，就自己拒絕。我不會替你簽，也不會替你推掉。"});}
  return {lines:lines,ch:[ch("我拒絕檢查",{type:"choice",id:"refuse_exam"}),ch("先不談這個",{type:"choice",id:"quiet"}),ch("我怕被送走",{type:"choice",id:"fear"})],opt:{min:4}};
 }
 if(/離開|走了|逃走|逃出去|不想留/.test(text)){
  lines.push({sp:"",t:"你說想離開。人還坐著。"});
  if(presentIds().indexOf("hairuo")>=0){lines.push({sp:"hairuo",t:"歐海辰。門沒有鎖。"});lines.push({sp:"hairuo",t:"你要走，就自己走。我不會把這句話當成你已經出了門。看我。"});}
  return {lines:lines,ch:[ch("起身離開",{type:"choice",id:"leave"}),ch("還是留下",{type:"choice",id:"quiet"}),ch("什麼都不說",{type:"choice",id:"quiet"})],opt:{min:4}};
 }
 if(topic==="工作"||/加班|報表|表格|李珮儀|劉啟明/.test(text))return {_id:"work",pre:lines};
 if(/安靜|沉默|不說了|坐著|先坐/.test(text))return {_id:"quiet",pre:lines};
 if(topic==="過去"){
  lines.push({sp:"",t:"你只說得出：十七歲以前是斷的。"});
  if(presentIds().indexOf("hairuo")>=0){lines.push({sp:"hairuo",t:"歐海辰。斷開就可以停。"});lines.push({sp:"hairuo",t:"你不用為了完整把自己推回去。我在。"});}
  return {lines:lines,ch:[ch("停在這裡",{type:"choice",id:"quiet"}),ch("說十七歲之後",{type:"choice",id:"go_on"}),ch("找個更亮的地方",{type:"go",place:"lobby"})],opt:{min:8,mood:-2,trust:{hairuo:2}}};
 }
 if(topic==="身體"){
  lines.push({sp:"",t:"你報了一個分數。"});
  if(presentIds().indexOf("hairuo")>=0){lines.push({sp:"hairuo",t:"歐海辰。六。你說得出來。"});lines.push({sp:"hairuo",t:"先坐低。我看著你。你要停，就停。"});}
  return {lines:lines,ch:[ch("含硝酸甘油",{type:"choice",id:"nitro"}),ch("維持現在",{type:"choice",id:"quiet"}),ch("我不要檢查",{type:"choice",id:"refuse_exam"})],opt:{min:6,body:-2}};
 }
 if(topic==="請求"){
  lines.push({sp:"",t:"你想請求，話還沒有成形。"});
  if(presentIds().indexOf("hairuo")>=0){lines.push({sp:"hairuo",t:"歐海辰。你要我做什麼，看著我說。"});lines.push({sp:"hairuo",t:"做得到，我就做。做不到，我不裝。"});}
  else lines.push({sp:"",t:"旁邊沒有能答應你的人。你把請求先收著。"});
  return {lines:lines,ch:[ch("請她不要送我走",{type:"choice",id:"fear"}),ch("請她什麼都別問",{type:"choice",id:"quiet"}),ch("先不請求",{type:"choice",id:"quiet"})],opt:{min:6,trust:{hairuo:1}}};
 }
 if(topic==="近況"){
  lines.push({sp:"",t:"你把近況報完。"});
  if(presentIds().indexOf("hairuo")>=0){lines.push({sp:"hairuo",t:"歐海辰。這些我都聽見了。"});lines.push({sp:"hairuo",t:"哪一件最沉，你從那一件說。我不替你排。"});}
  return {lines:lines,ch:[ch("睡眠",{type:"choice",id:"go_on"}),ch("工作",{type:"choice",id:"work"}),ch("先這樣",{type:"choice",id:"quiet"})],opt:{min:6}};
 }
 var sp=presentIds().indexOf("hairuo")>=0?"hairuo":(S.focus||presentIds()[0]||"");
 lines.push({sp:"",t:"你把話說完。"});
 if(sp==="hairuo"){lines.push({sp:"hairuo",t:"歐海辰。我聽見了。"});lines.push({sp:"hairuo",t:"看著我。下一句還是你的。我不替你寫完。"});}
 else if(sp==="xingchen"){lines.push({sp:"xingchen",t:"歐海辰。說完了。"});lines.push({sp:"xingchen",t:"人我看見了。下一處我還是會問你。"});}
 else if(sp==="liu"){lines.push({sp:"liu",t:"歐海辰。與工作無關的話，下班再說。"});lines.push({sp:"liu",t:"歐海辰，表還是今天。"});}
 else if(sp==="li"){lines.push({sp:"li",t:"歐海辰，你說這些，表還在。"});lines.push({sp:"li",t:"你看一下嘛。我等下真的有事。"});}
 else lines.push({sp:"",t:"沒有人接話。"});
 opt.trust={};if(sp==="hairuo")opt.trust.hairuo=1;
 return {lines:lines,ch:Story.placeChoices(S.place),opt:opt};
};
Story._unwrap=function(rest){
 if(!rest)return Story.pack([{sp:"",t:"我停了一下。"}],Story.placeChoices(S.place),{});
 if(rest._crisis)return Story.crisis();
 if(rest._flash)return Story.flash();
 if(rest._go)return Story.go(rest._go);
 if(rest._contact)return Story.contact(rest._contact);
 if(rest._id){
  var pre=rest.pre||[];
  var sc=Story.byId(rest._id);
  if(pre.length){S.view.lines=pre.concat(S.view.lines);S.log.splice(S.log.length-sc.lines.length,0);pre.forEach(function(l){S.log.splice(S.log.length-sc.lines.length,0,{sp:l.sp||"",t:l.t,player:0});});}
  return S.view;
 }
 return Story.pack(rest.lines||[],rest.ch||Story.placeChoices(S.place),rest.opt||{});
};
Story.input=function(a){
 a=a||{};
 var text=String(a.text||"").trim();
 if(!text)return S.view;
 if(a.topic)Story.topic=a.topic;
 if(a.att)Story.att=a.att;
 if(a.mode)Story.mode=a.mode;
 var echo={sp:"haichen",t:safeEcho(text),player:1};
 var rest;
 var mode=a.mode||Story.mode||"說";
 var tag="說";
 if(/^\/(設定|宣告|劇情|旁白)/.test(text)||mode==="設定")tag="設定";
 else if(/^\/指令/.test(text)||mode==="做")tag="指令";
 var body=text.replace(/^\/(設定|宣告|劇情|旁白|指令)\s*/,"");
 S._povAsk=Story.povAsk(body)||"";
 if(/操控/.test(body)){var cid=findPerson(body);if(cid)S.control=cid;}
 if(Story.harm(body)||Story.abuse(body)||Story.restraint(body))rest=Story.harm(body)?{_crisis:1}:{_flash:1};
 else if(tag==="說"&&Story.isSilence(body))rest=Story.silenceScene();
 else if(tag==="設定")rest=Story.declare(body);
 else if(tag==="指令")rest=Story.command(body);
 else rest=Story.reply(body,a);
 if(rest&&rest.opt&&S._povAsk)rest.opt.pov=S._povAsk;
 if(rest&&(rest._crisis||rest._flash||rest._go||rest._contact||rest._id)){
  var before=S.log.length;
  Story._unwrap(rest);
  S.log.splice(before,0,{sp:"haichen",t:echo.t,player:1});
  if(S.view&&S.view.lines)S.view.lines=[{sp:"haichen",t:echo.t,player:1}].concat(S.view.lines);
  S.recent=S.log.slice(-18).map(function(l){return (l.player?"你：":(l.sp?cn(l.sp)+"：":""))+l.t;}).join("\n").slice(-2400);
  saveGame(true);
  return S.view;
 }
 var lines=[echo].concat(rest.lines||[]);
 return Story.pack(lines,rest.ch||Story.placeChoices(S.place),rest.opt||{});
};
Story.act=function(act){
 if(!act)return S.view;
 if(act.type==="go")return Story.go(act.place);
 if(act.type==="contact")return Story.contact(act.id);
 if(act.type==="input")return Story.input({text:act.text,mode:act.mode||"做",topic:Story.topic,att:Story.att});
 if(act.type==="choice"){
  var before=S.log.length;
  Story.byId(act.id);
  if(act.label){
   var echo={sp:"haichen",t:safeEcho(act.label),player:1};
   S.log.splice(before,0,echo);
   if(S.view&&S.view.lines)S.view.lines=[echo].concat(S.view.lines);
   S.recent=S.log.slice(-18).map(function(l){return (l.player?"你：":(l.sp?cn(l.sp)+"：":""))+l.t;}).join("\n").slice(-2400);
   saveGame(true);
  }
  return S.view;
 }
 return S.view;
};

/* ===== 介面：故事閱讀，不是表單 ===== */
var UI={};
var toastT=null;
function toast(s){var n=document.getElementById("toast");if(!n)return;n.textContent=s;n.className="on";clearTimeout(toastT);toastT=setTimeout(function(){n.className="";},2200);}
function busy(on){var n=document.getElementById("busy");if(n)n.className=on?"on":"";}
function showScr(id){["title","game"].forEach(function(s){var n=document.getElementById(s);if(n)n.className="scr"+(s===id?" on":"");});}
function closeSheet(){var s=document.getElementById("sheet");if(s)s.className="";}
function openSheet(title,html){document.getElementById("shT").textContent=title;document.getElementById("shB").innerHTML=html;document.getElementById("sheet").className="on";}
function renderChips(){
 var box=document.getElementById("chips");if(!box)return;
 var h="";
 TOPICS.forEach(function(t){h+='<button type="button" data-k="topic" data-v="'+t+'"'+(Story.topic===t?' class="on"':"")+">"+t+"</button>";});
 ATTS.forEach(function(t){h+='<button type="button" data-k="att" data-v="'+t+'"'+(Story.att===t?' class="on"':"")+">"+t+"</button>";});
 box.innerHTML=h;
}
function syncPlaceholder(){
 var ph={"說":"回她一句","做":"做一件事，或 /指令","設定":"寫下一件已經成立的事"};
 var inp=document.getElementById("free");
 var mode=document.getElementById("mode");
 if(mode)mode.textContent=Story.mode;
 if(inp)inp.placeholder=ph[Story.mode]||"回她一句";
}
function avatarHtml(id){
 var p=P(id)||PEOPLE[id]||{n:id,color:"#9bb"};
 if(PORTRAIT[id])return '<img class="av" alt="" src="assets/'+PORTRAIT[id]+'.webp?v=thin2">';
 var ch=(p.n||"?").charAt(0);
 return '<span class="av ph" style="background:'+(p.color||"#8ec9bf")+'">'+esc(ch)+"</span>";
}
function renderMeters(){
 var box=document.getElementById("meters");if(!box||!S)return;
 var d=(S.delta)||{body:0,speech:0,mood:0,trust:0};
 var vals=[
  ["身體",S.body,d.body],
  ["語言",S.speech==null?58:S.speech,d.speech],
  ["心緒",S.mood,d.mood],
  ["信任",typeof S.rel==="number"?S.rel:(S.trust.hairuo||0),d.trust]
 ];
 var h="";
 vals.forEach(function(r){
  var n=+r[2]||0;
  var mark=n?('<em class="'+(n>0?"up":"dn")+'">'+(n>0?"+"+n:n)+"</em>"):"";
  h+='<div class="m"><span>'+r[0]+" <b>"+r[1]+"</b>"+mark+'</span><div class="track"><i style="width:'+clamp(r[1],0,100)+'%"></i></div></div>';
 });
 box.innerHTML=h;
}
function renderTurn(){
 if(!S)return;
 var turn=S.turn||{};
 var sum=document.getElementById("sum");
 if(sum)sum.textContent=turn.summary||"";
 var pres=document.getElementById("presence");
 if(pres){
  var ids=presentIds();
  pres.textContent=ids.length?("誰在場："+ids.map(cn).join("、")):"誰在場：只有你";
 }
 var count=document.getElementById("count");
 if(count){
  if(turn.countdown&&turn.countdown.left!=null){
   count.hidden=false;
   count.textContent="倒計時　"+turn.countdown.label+"　剩 "+turn.countdown.left+" 分鐘";
  }else{count.hidden=true;count.textContent="";}
 }
}
function sheetPeople(){
 if(!S)return;
 var snap=(S.turn&&S.turn.snap)||[];
 var h="";
 snap.forEach(function(p){
  h+='<div class="snapc"><b>'+esc(p.n)+'</b><small>'+esc(p.role||"")+'</small><p>'+esc(p.core||"")+'</p><p>'+esc(p.line||"")+'</p></div>';
 });
 if(!h)h='<p class="logl">這一幕還沒有人物快照。</p>';
 var eye=S.turn&&S.turn.pov&&S.turn.pov!=="haichen"?("這一幕的眼睛："+(S.turn.pov==="third"?"第三人稱":cn(S.turn.pov))+"。"):"";
 if(eye)h='<p class="logl">'+esc(eye)+"四條仍是歐海辰的。</p>"+h;

function sceneBgKey(){
 if(!S)return "counsel";
 var f=S.flags||{};
 var patient=S.place==="ward"||S.place==="er"||!!(f.admitted||f.inBed||f.inbed||f.bed||f.patient);
 if(patient)return "ward";
 return (typeof PLACE_BG!=="undefined"&&PLACE_BG[S.place])||"hall";
}
function youLine(t){
 var s=String(t||"").replace(/^「/,"").replace(/」$/,"").replace(/\s+/g," ").trim();
 if(!s)s="……";
 return "你說："+s;
}
function render(){
 if(!S||!S.view)return;
 var pl=PLACES[S.place]||{n:"",floor:""};
 var chEl=document.getElementById("hCh");
 if(chEl)chEl.textContent=S.chapter||"第一章 · 刀刃與界限";
 document.getElementById("hPlace").textContent=pl.n;
 document.getElementById("hFloor").textContent=pl.floor;
 document.getElementById("hTime").textContent=timeStr();
 var bg=document.getElementById("bg");
 if(bg){
  var key=sceneBgKey();
  if(bg.getAttribute("data-k")!==key){
   bg.setAttribute("data-k",key);
   bg.style.backgroundImage="url('assets/bg_"+key+".webp?v=early')";
  }
 }
 renderMeters();
 renderTurn();
 var html="";
 var src=(S.log&&S.log.length)?S.log:(S.view.lines||[]);
 var block=null;
 function flush(){
  if(!block)return;
  var person=P(block.sp)||PEOPLE[block.sp]||{n:block.sp,color:"#9bb"};
  var lines=block.lines.map(function(tx){return '<p class="ln">'+esc(tx)+"</p>";}).join("");
  html+='<div class="speech" data-who="'+esc(block.sp)+'">'+avatarHtml(block.sp)+'<div class="who"><div class="nm" style="color:'+esc(person.color||"#9bb")+'">'+esc(person.n||"")+"</div>"+lines+"</div></div>";
  block=null;
 }
 src.forEach(function(l){
  if(l.player||l.sp==="haichen"){
   flush();
   html+='<p class="yousaid">'+esc(youLine(l.t))+"</p>";
   return;
  }
  if(!l.sp){
   flush();
   if(/^第.+章/.test(l.t))html+='<p class="chap">'+esc(l.t)+"</p>";
   else html+='<p class="stage">'+esc(l.t)+"</p>";
   return;
  }
  if(block&&block.sp===l.sp)block.lines.push(l.t);
  else{flush();block={sp:l.sp,lines:[l.t]};}
 });
 flush();
 document.getElementById("txt").innerHTML=html;
 var ch=document.getElementById("choices");ch.innerHTML="";
 (S.view.ch||[]).slice(0,5).forEach(function(c,i){
  var b=document.createElement("button");b.type="button";
  var tag=c.tag||"探索";
  b.innerHTML='<span class="tag">【'+esc(tag)+"】</span>"+esc(c.t);
  b.dataset.i=String(i);
  b.addEventListener("click",function(){
   var cur=S.view.ch[i];if(!cur)return;
   var act=cur.act;if(act)act.label=cur.t;
   Story.act(act);render();
  });
  ch.appendChild(b);
 });
 renderChips();
 syncPlaceholder();

function modelOptions(preset,current){
 var p=PRESETS[preset]||PRESETS.custom;
 var models=(p.models||[]).slice();
 if(current&&models.indexOf(current)<0)models.unshift(current);
 if(!models.length)return '<option value="">（自訂模型）</option>';
 return models.map(function(m){return '<option value="'+esc(m)+'"'+(m===current?" selected":"")+">"+esc(m)+"</option>";}).join("");
}
function applyPresetFields(k){
 var p=PRESETS[k]||PRESETS.custom;
 SET.preset=k;
 if(k!=="custom"){
  if(p.base)SET.base=p.base;
  if(p.model)SET.model=p.model;
 }
 var base=document.getElementById("sBase");
 var model=document.getElementById("sModel");
 var model2=document.getElementById("sModel2");
 var note=document.getElementById("sNote");
 var pre=document.getElementById("sPre");
 if(pre)pre.value=k;
 if(base)base.value=SET.base||"";
 if(model2)model2.value=SET.model||"";
 if(model)model.innerHTML=modelOptions(k,SET.model||"");
 if(note)note.textContent=p.key||"";
}
function readSettingsForm(){

 SET.base=document.getElementById("sBase").value.trim();
 var listed=document.getElementById("sModel").value||"";
 var typed=(document.getElementById("sModel2").value||"").trim();
 SET.model=typed||listed;
 SET.key=document.getElementById("sKey").value.trim();
 SET.firewall=document.getElementById("sFw").checked;
 if(!SET.base&&SET.preset!=="custom")SET.base=(PRESETS[SET.preset]&&PRESETS[SET.preset].base)||"";
 if(!SET.model&&SET.preset!=="custom")SET.model=(PRESETS[SET.preset]&&PRESETS[SET.preset].model)||"";
}

/* 把整頁釘在視覺視窗裡：鍵盤與 Safari 底欄蓋住的部分不把頁面頂走。 */
function pinFrame(){
 var app=document.getElementById("app");if(!app)return;
 var vv=window.visualViewport;
 if(!vv){app.style.height="";app.style.transform="";return;}
 var top=vv.offsetTop||0;
 var h=vv.height||window.innerHeight;
 app.style.height=Math.round(h)+"px";
 app.style.transform="translateY("+Math.round(top)+"px)";
}

 });
 pinFrame();
 if(window.visualViewport){
  window.visualViewport.addEventListener("resize",pinFrame);
  window.visualViewport.addEventListener("scroll",pinFrame);
 }
 window.addEventListener("resize",pinFrame);
 window.addEventListener("orientationchange",pinFrame);
 window.addEventListener("scroll",function(){if(window.scrollX||window.scrollY)window.scrollTo(0,0);pinFrame();},{passive:true});
}
